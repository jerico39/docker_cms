name: Main Config
version: 1.0.0
schema: v1
models:
  - name: qwen3.5-claude-coder 4B(qwen3.5派生モデル)
    provider: ollama
    model: rafw007/qwen35-claude-coder:4b
    roles:
      - chat
      - edit
      - apply
    # ─── ローカルでのエージェント性能を最大化する設定(from Gemini) ───
    capabilities:
      - tool_use                  # エージェント機能（ファイル編集やターミナル実行）を強制有効化
    
    defaultCompletionOptions:
      temperature: 0.0            # 決定論的に動作させ、ハルシネーション（捏造）を排除
      contextLength: 32768        # 読み込めるコード量を大きく確保（スペックに応じて65536
  #  requestOptions:
  #    extraBodyProperties:
  #      think: false
  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
    
